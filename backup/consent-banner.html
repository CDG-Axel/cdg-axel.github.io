<!--
  ИНСТРУКЦИЯ ПО ПОДКЛЮЧЕНИЮ БАННЕРА СОГЛАСИЯ НА GOOGLE ANALYTICS

  Модуль состоит из трёх частей: consent.css (стили), consent.js (логика)
  и этого фрагмента (разметка баннера). Аналитика Google не загружается,
  пока посетитель не нажал «Принять».

  Расположение файлов consent.css и consent.js определяет сам проект.
  В href и src ниже нужно прописать те пути, по которым они лежат в проекте
  (например, styles/consent.css и code/consent.js).

  ШАГ 1. Удалить старый Google tag, если он есть.
    Нужно удалить со страницы (или из общего шаблона) всё, что относится к Google Analytics:
      - <script async src="https://www.googletagmanager.com/gtag/js?id=..."></script>
      - блок с window.dataLayer, function gtag(), gtag('js', ...) и gtag('config', ...)
    Если оставить их, аналитика будет работать без согласия посетителя.
    Если проект сам вызывает gtag('event', ...), эти вызовы продолжат работать:
    модуль создаёт глобальную gtag, а до согласия её вызовы ничего не делают.
    Вызовы из скриптов, которые выполняются до consent.js, нужно писать
    как window.gtag?.('event', ...), потому что на тот момент gtag ещё не создана.

  ШАГ 2. Подключить стили.
    Строку <link> ниже желательно перенести в <head> страницы.

  ШАГ 3. Вставить разметку баннера.
    Блок <div id="cookie-banner"> нужно поместить в HTML страницы перед </body>.
    Он должен лежать прямо в HTML, а не создаваться скриптами позже.
    Текст баннера можно менять, а ссылку /privacy нужно заменить
    на страницу политики конфиденциальности проекта.
    Кнопки находятся по атрибутам data-consent="accept" и data-consent="decline",
    эти атрибуты менять нельзя.

  ШАГ 4. Подключить скрипт.
    Тег <script> ниже ставится сразу после баннера, перед </body>.
      - вместо G-XXXXXXXXXX нужно указать идентификатор Google Analytics проекта;
      - type="module" обязателен, async добавлять нельзя;
      - по умолчанию рекламные параметры запрещены. Чтобы разрешить их,
        нужно добавить к адресу &allowed= и буквы разрешаемых параметров:
          s = ad_storage, u = ad_user_data, p = ad_personalization
        Например: consent.js?key=G-XXXXXXXXXX&allowed=sup

  ШАГ 5. Добавить элемент для сброса выбора (по желанию).
    Любому элементу страницы нужно добавить атрибут data-consent="reset".
    Это может быть ссылка, кнопка, пункт списка и т. д., например:
      <a href="#" data-consent="reset">Настройки cookie</a>
      <button type="button" data-consent="reset">Настройки cookie</button>
      <li data-consent="reset">Настройки cookie</li>
    Элементы, добавленные на страницу позже, тоже будут работать.
    По клику удаляются cookie Google и сохранённый выбор, страница перезагружается
    и баннер показывается снова.
    ВАЖНО: по клику страница перезагружается, поэтому на такой элемент не стоит вешать
    свои асинхронные действия (запросы на сервер, таймеры): перезагрузка может их прервать.
    Синхронные обработчики выполнятся до перезагрузки.
-->

<!-- Шаг 2: желательно перенести в <head> -->
<link href="/css/consent.css" rel="stylesheet">

<!-- Шаг 3: разметка баннера, перед </body> -->
<div id="cookie-banner" role="region" aria-label="Настройки cookie">
  <span>
    Мы используем Google Analytics (cookie), чтобы понимать посещаемость и типы устройств.
    Аналитика включится только с вашего согласия.
    <a href="/privacy">Подробнее</a>
  </span>
  <div class="cb-actions">
    <button type="button" data-consent="decline">Отклонить</button>
    <button type="button" data-consent="accept">Принять</button>
  </div>
</div>

<!-- Шаг 4: сразу после баннера, перед </body> -->
<script type="module" src="/js/consent.js?key=G-XXXXXXXXXX"></script>
