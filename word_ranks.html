<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Редкость английских слов</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #fafafa; --fg: #1d1d1f; --muted: #6b6b72; --card: #fff; --line: #e3e3e8; --accent: #2f5fd0;
            --l5: #1f9d55; --l4: #6aa84f; --l3: #b8901a; --l2: #e07b39; --l1: #c0392b;
        }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #131316; --fg: #ececf0; --muted: #9a9aa4; --card: #1c1c21; --line: #2e2e36; --accent: #7b9cf0; }
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
        main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
        h1 { font-size: 1.5rem; margin: 0 0 4px; }
        .muted { color: var(--muted); }
        textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--fg); font: inherit; resize: vertical; }
        textarea:focus, input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
        .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 10px 0 12px; }
        button { padding: 8px 14px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
        button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--line); }
        button.link { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; font-size: .9rem; }
        .icons { display: flex; gap: 6px; margin-left: auto; }
        .icon { width: 38px; height: 38px; padding: 0; display: inline-flex; align-items: center; justify-content: center; background: transparent; color: var(--accent); border: 1px solid var(--line); }
        .icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .icon .ok, .icon.done .lnk { display: none; }
        .icon.done .ok { display: block; }
        .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--card); }
        .seg label { position: relative; cursor: pointer; }
        .seg input { position: absolute; opacity: 0; pointer-events: none; }
        .seg span { display: block; padding: 8px 14px; }
        .seg input:checked + span { background: var(--accent); color: #fff; }
        .seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: -3px; }
        #status { margin: 0 0 8px; font-size: .9rem; }
        #status:empty { display: none; }
        #summary { margin-bottom: 8px; font-size: .95rem; }
        .scroll { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 8px; font-variant-numeric: tabular-nums; }
        th, td { padding: 7px 12px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
        th:first-child, td:first-child { text-align: left; }
        th { font-weight: 600; color: var(--muted); font-size: .8rem; line-height: 1.2; white-space: normal; }
        tr:last-child td { border-bottom: 0; }
        td:nth-child(3) { color: var(--accent); font-weight: 600; }
        td:nth-child(4) { color: var(--muted); }
        .lv { display: inline-block; min-width: 1.6em; padding: 0 6px; border-radius: 10px; color: #fff; text-align: center; font-weight: 600; }
        .l5 { background: var(--l5); } .l4 { background: var(--l4); } .l3 { background: var(--l3); } .l2 { background: var(--l2); } .l1 { background: var(--l1); }
        dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--fg); padding: 20px; width: min(340px, 92vw); }
        dialog::backdrop { background: rgba(0, 0, 0, .45); }
        dialog h2 { font-size: 1.15rem; margin: 0 0 12px; }
        dialog h3 { font-size: .95rem; margin: 0 0 6px; }
        dialog label { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 8px 0; }
        dialog input { width: 120px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); font: inherit; text-align: right; }
        #dlgError { color: var(--l1); min-height: 1.4em; font-size: .9rem; }
        .dlgButtons { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
        @media (max-width: 560px) {
            th, td { padding: 6px 7px; }
            .seg { order: 3; width: 100%; }
            .seg label { flex: 1; text-align: center; }
        }
    </style>
</head>
<body>
<main>
    <h1>Редкость английских слов</h1>
    <p id="meta" class="muted">Загрузка списка слов…</p>
    <textarea id="input" rows="5" placeholder="mutter, trade, helpful, thicket" spellcheck="false" autofocus></textarea>
    <p class="muted" style="margin:4px 0 0;font-size:.85rem">Слова через пробел, запятую или с новой строки; можно вставить целый текст. Ctrl+Enter проверяет.</p>
    <div class="row">
        <button id="go">Проверить</button>
        <div class="seg" id="corpusGroup" role="radiogroup" aria-label="Словарь"></div>
        <div class="icons">
            <button class="icon" id="copy" title="Скопировать ссылку" aria-label="Скопировать ссылку">
                <svg class="lnk" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                <svg class="ok" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
            </button>
            <button class="icon" id="boundsBtn" title="Настройки" aria-label="Настройки">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </button>
        </div>
    </div>
    <p id="status" class="muted" role="status"></p>
    <div id="summary"></div>
    <div class="scroll">
        <table id="table" hidden>
            <thead><tr><th>слово</th><th>ранг</th><th>на млн</th><th>тыс. томов</th><th>уровень</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>
</main>

<dialog id="dlg">
    <h2>Настройки</h2>
    <h3>Границы уровней по рангу</h3>
    <label>Уровень 5, ранг до <input id="b0" type="number" min="1" step="1"></label>
    <label>Уровень 4, ранг до <input id="b1" type="number" min="1" step="1"></label>
    <label>Уровень 3, ранг до <input id="b2" type="number" min="1" step="1"></label>
    <label>Уровень 2, ранг до <input id="b3" type="number" min="1" step="1"></label>
    <p class="muted" style="margin:4px 0;font-size:.85rem">Дальше уровень 1. Числа по возрастанию, общие для всех словарей.</p>
    <button id="dlgReset" class="link">Сбросить к значениям по умолчанию</button>
    <div id="dlgError"></div>
    <div class="dlgButtons">
        <button id="dlgCancel" class="secondary">Отмена</button>
        <button id="dlgSave">Сохранить</button>
    </div>
</dialog>

<script>
    const CORPORA = [
        { id: "all", label: "Все книги", url: "/json/ranks_1990-2016.gz" },
        { id: "fiction", label: "Проза", url: "/json/ranks_fict_1990-2016.gz" },
    ];
    const DEFAULT_BOUNDS = [1000, 4000, 10000, 30000];
    const MAX_WORDS_IN_URL = 200;
    const BOUNDS_KEY = "wordRanksBounds";
    const CORPUS_KEY = "wordRanksCorpus";
    const $ = id => document.getElementById(id);
    const format = number => number.toLocaleString("ru-RU");
    const saved = key => { try { return localStorage.getItem(key); } catch { return null; } };
    const save = (key, value) => { try { localStorage.setItem(key, value); } catch {} };

    const loads = new Map();
    const ready = new Map();
    let bounds = readBounds();
    let corpus = readCorpus();

    function parseBounds(text) {
        const values = (text || "").split(",").map(Number);
        const valid = values.length === 4 && values.every((value, i) => Number.isInteger(value) && value > 0 && (i === 0 || value > values[i - 1]));
        return valid ? values : null;
    }

    function readBounds() {
        return parseBounds(new URLSearchParams(location.search).get("b")) || parseBounds(saved(BOUNDS_KEY)) || [...DEFAULT_BOUNDS];
    }

    function readCorpus() {
        const id = new URLSearchParams(location.search).get("c") || saved(CORPUS_KEY);
        return CORPORA.find(c => c.id === id) || CORPORA[0];
    }

    function levelByRank(rank) {
        const index = bounds.findIndex(limit => rank <= limit);
        return index < 0 ? 1 : 5 - index;
    }

    async function fetchRanks(url) {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const bytes = new Uint8Array(await response.arrayBuffer());
        if (bytes[0] === 0x50 && bytes[1] === 0x4b) throw new Error("файл оказался ZIP-архивом, а нужен именно gzip");
        if (bytes[0] === 0x1f && bytes[1] === 0x8b) {
            if (typeof DecompressionStream === "undefined") throw new Error("браузер не умеет распаковывать gzip, обновите его");
            const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
            return JSON.parse(await new Response(stream).text());
        }
        return JSON.parse(new TextDecoder().decode(bytes));
    }

    function loadCorpus(c) {
        if (!loads.has(c.id)) {
            loads.set(c.id, fetchRanks(c.url)
                .then(data => { ready.set(c.id, data); return data; })
                .catch(error => { loads.delete(c.id); throw error; }));
        }
        return loads.get(c.id);
    }

    function parseWords(text) {
        const tokens = text.replace(/[’‘]/g, "'").toLowerCase().match(/\p{L}+(?:'\p{L}+)*/gu) || [];
        const words = tokens.map(token => token.replace(/n't$/, "").replace(/'(?:s|re|ll|ve|d|m)$/, "")).filter(Boolean);
        return [...new Set(words)];
    }

    function lookup(data, word) {
        if (!Object.hasOwn(data.words, word)) return { word, rank: null, level: 0 };
        const [rank, perMillion, volumes] = data.words[word];
        return { word, rank, perMillion, volumes, level: levelByRank(rank) };
    }

    function thousands(volumes) {
        const value = volumes / 1000;
        return value < 99.95 ? value.toFixed(1) : String(Math.round(value));
    }

    function addCell(row, text, className) {
        const cell = row.insertCell();
        cell.textContent = text;
        if (className) cell.className = className;
        return cell;
    }

    function render(rows, c) {
        const body = $("table").tBodies[0];
        body.replaceChildren();
        for (const row of rows) {
            const tr = body.insertRow();
            addCell(tr, row.word);
            if (row.rank === null) {
                addCell(tr, "нет в списке", "muted").colSpan = 4;
                continue;
            }
            addCell(tr, String(row.rank));
            addCell(tr, String(row.perMillion));
            addCell(tr, thousands(row.volumes));
            const level = addCell(tr, "").appendChild(document.createElement("span"));
            level.className = `lv l${row.level}`;
            level.textContent = row.level;
        }
        $("table").hidden = rows.length === 0;
        const counts = [5, 4, 3, 2, 1].map(level => `${level}: ${rows.filter(row => row.level === level).length}`);
        $("summary").textContent = rows.length
            ? `${c.label}. Уровни ${counts.join(", ")}; нет в списке: ${rows.filter(row => row.rank === null).length}. Границы: ${bounds.map(format).join(" / ")}`
            : "";
    }

    function showMeta(data, c) {
        $("meta").textContent = `Словарь «${c.label}»: окно лет ${data.meta.from}–${data.meta.to}, слов ${format(data.meta.words)}`;
    }

    function updateUrl(words) {
        const params = new URLSearchParams({ c: corpus.id });
        if (words.length > 0 && words.length <= MAX_WORDS_IN_URL) params.set("words", words.join(","));
        if (bounds.join() !== DEFAULT_BOUNDS.join()) params.set("b", bounds.join(","));
        history.replaceState(null, "", `?${params.toString().replaceAll("%2C", ",")}`);
    }

    async function analyze() {
        const current = corpus;
        const words = parseWords($("input").value);
        updateUrl(words);
        if (!ready.has(current.id)) {
            $("status").textContent = `Загрузка словаря «${current.label}»…`;
            try {
                await loadCorpus(current);
            } catch (error) {
                $("status").textContent = `Не удалось загрузить словарь: ${error.message}`;
                return;
            }
            if (corpus !== current) return;
        }
        $("status").textContent = "";
        const data = ready.get(current.id);
        showMeta(data, current);
        const rows = words.map(word => lookup(data, word)).sort((a, b) => b.level - a.level || (a.word < b.word ? -1 : a.word > b.word ? 1 : 0));
        render(rows, current);
    }

    function setCorpus(id) {
        corpus = CORPORA.find(c => c.id === id);
        save(CORPUS_KEY, id);
        analyze();
    }

    function fillDialog(values) {
        values.forEach((value, i) => { $(`b${i}`).value = value; });
        $("dlgError").textContent = "";
    }

    for (const c of CORPORA) {
        const label = document.createElement("label");
        const radio = Object.assign(document.createElement("input"), { type: "radio", name: "corpus", value: c.id, checked: c === corpus });
        radio.onchange = () => setCorpus(c.id);
        label.append(radio, Object.assign(document.createElement("span"), { textContent: c.label }));
        $("corpusGroup").append(label);
    }

    $("go").onclick = analyze;
    $("input").addEventListener("keydown", event => {
        if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) analyze();
    });
    $("copy").onclick = async () => {
        await analyze();
        try {
            await navigator.clipboard.writeText(location.href);
            $("copy").classList.add("done");
            setTimeout(() => $("copy").classList.remove("done"), 2000);
        } catch {
            $("status").textContent = "Не удалось скопировать, возьмите ссылку из адресной строки";
        }
    };
    $("boundsBtn").onclick = () => { fillDialog(bounds); $("dlg").showModal(); };
    $("dlgCancel").onclick = () => $("dlg").close();
    $("dlgReset").onclick = () => fillDialog(DEFAULT_BOUNDS);
    $("dlgSave").onclick = () => {
        const values = parseBounds([0, 1, 2, 3].map(i => $(`b${i}`).value).join(","));
        if (!values) {
            $("dlgError").textContent = "Нужны четыре целых числа по возрастанию.";
            return;
        }
        bounds = values;
        save(BOUNDS_KEY, values.join(","));
        $("dlg").close();
        analyze();
    };

    const initial = new URLSearchParams(location.search).get("words");
    if (initial) $("input").value = initial.split(",").join(", ");
    loadCorpus(corpus)
        .then(data => { showMeta(data, corpus); if (initial) analyze(); })
        .catch(error => { $("meta").textContent = `Не удалось загрузить список слов: ${error.message}`; })
        .finally(() => CORPORA.filter(c => c !== corpus).forEach(c => loadCorpus(c).catch(() => {})));
</script>
</body>
</html>
